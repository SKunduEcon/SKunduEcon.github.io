<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">US payroll employment recovery after recessions</title>
<desc id="desc">Months to regain the pre-recession payroll employment level: 31 months in 1990–91, 46 in 2001, 77 in 2007–09 and 29 in 2020.</desc>
<rect width="1000" height="470" fill="#202020"/>
<text x="54" y="54" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="27" font-weight="700">Months to regain pre-recession payroll employment</text>
<text x="54" y="88" fill="#b8b8b8" font-family="Arial,sans-serif" font-size="17">United States · months from the pre-recession peak</text>
<text x="55" y="170" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22">1990–91</text><rect x="205" y="145" width="650" height="38" rx="3" fill="#444444"/><rect x="205" y="145" width="251.875" height="38" rx="3" fill="#e05a70"/><text x="471.875" y="171" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22" font-weight="700">31 months</text><text x="55" y="250" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22">2001</text><rect x="205" y="225" width="650" height="38" rx="3" fill="#444444"/><rect x="205" y="225" width="373.74999999999994" height="38" rx="3" fill="#e05a70"/><text x="593.75" y="251" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22" font-weight="700">46 months</text><text x="55" y="330" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22">2007–09</text><rect x="205" y="305" width="650" height="38" rx="3" fill="#444444"/><rect x="205" y="305" width="625.625" height="38" rx="3" fill="#e05a70"/><text x="845.625" y="331" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22" font-weight="700">77 months</text><text x="55" y="410" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22">2020</text><rect x="205" y="385" width="650" height="38" rx="3" fill="#444444"/><rect x="205" y="385" width="235.625" height="38" rx="3" fill="#e05a70"/><text x="455.625" y="411" fill="#f2f2f2" font-family="Arial,sans-serif" font-size="22" font-weight="700">29 months</text>
<text x="55" y="445" fill="#b8b8b8" font-family="Arial,sans-serif" font-size="15">2020 was a shutdown shock with a fast reopening; it is not directly comparable with earlier recoveries.</text>
</svg>